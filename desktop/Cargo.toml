[package]
name = "bioplay"
version = "0.1.0"
edition = "2021"
description = "bioplay pour le bureau : libmpv, interface de verre liquide plein écran."

[dependencies]
bioplay-core = { path = "../core" }
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.37", default-features = false, features = ["wayland", "x11", "clipboard", "links"] }
egui_glow = { version = "0.37", features = ["winit"] }
glutin = "0.32"
glutin-winit = "0.5"
raw-window-handle = "0.6"
rfd = { version = "0.18", default-features = false, features = ["xdg-portal", "pollster", "wayland"] }
serde_json = "1"
